name: VX Walls Wallpaper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  build-wallpapers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover GitHub wallpaper candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VX_SEARCH_LIMIT: '20'
        run: python scripts/01_github_wall_finder.py

      - name: Check license evidence
        run: python scripts/02_license_check.py

      - name: Validate image quality
        run: python scripts/03_image_validator.py

      - name: Optimize accepted images
        run: python scripts/04_optimize_webp.py

      - name: Build wallpaper catalog
        run: python scripts/05_build_catalog.py

      - name: Commit pipeline output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates wallpapers wallpapers.json
          if git diff --cached --quiet; then
            echo "No pipeline output changes to commit."
            exit 0
          fi
          git commit -m "chore: update wallpaper pipeline output"
          git push
